{% extends "base.html" %}
{% block title %}Iniciar sesión · Gateway Modbus{% endblock %}
{% block content %}
<section class="mx-auto max-w-md rounded-xl bg-white p-6 shadow">
  <h1 class="mb-6 text-2xl font-semibold">Iniciar sesión</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div>
        <label class="mb-1 block font-medium" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="text-sm text-red-700">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button class="w-full rounded bg-blue-700 px-4 py-2 text-white hover:bg-blue-800" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
